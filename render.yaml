# Render blueprint: the always-on RiskPilot agent (riskpilot/Dockerfile).
# New > Blueprint > this repo. Render asks for the four secrets marked sync: false.
services:
  - type: web
    name: riskpilot-agent
    runtime: docker
    dockerfilePath: ./riskpilot/Dockerfile
    dockerContext: ./riskpilot
    plan: free               # kept awake by the Netlify keep-alive (riskpilot/keepalive); starter = always on natively
    region: singapore
    branch: main
    healthCheckPath: /v1/health
    autoDeploy: true
    buildFilter:
      paths:
        - riskpilot/Dockerfile
        - riskpilot/deploy/**
        - riskpilot/engine/**
        - riskpilot/shared/**
        - riskpilot/contracts/arc/deployments/**
    # The free plan has no persistent disk: the engine DB lives in /tmp, so decision history starts
    # fresh after a restart (the chain does anyway). On starter, add: disk {name, mountPath: /data, sizeGB: 1}.
    envVars:
      - key: AQUA_FORK_RPC_URL   # an Ethereum mainnet archive RPC (Alchemy)
        sync: false
      - key: ZG_API_KEY          # 0G Private Computer, for Ask RiskPilot
        sync: false
      - key: ARC_OPERATOR_KEY    # the arc-worker's operator key (riskpilot/.secrets/arc-operator.key)
        sync: false
      - key: RISKPILOT_ENGINE_KEY  # decision signatures (riskpilot/.secrets/engine.key)
        sync: false
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.io
      - key: DATA_DIR
        value: /tmp/riskpilot
