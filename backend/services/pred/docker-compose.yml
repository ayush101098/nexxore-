# Prediction Agent - High Performance Tech Stack
# 3-Layer Architecture: Intelligence → Market → Execution
# ═══════════════════════════════════════════════════════════════════════

version: '3.9'

services:
  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 1: INTELLIGENCE ENGINE
  # ═══════════════════════════════════════════════════════════════════════
  
  intelligence-engine:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: pred-intelligence
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DATABASE_URL=postgresql://pred:pred123@timescaledb:5432/pred_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      - timescaledb
      - redis
    networks:
      - pred-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 2: MARKET ENGINE  
  # ═══════════════════════════════════════════════════════════════════════
  
  market-engine:
    build:
      context: ./market
      dockerfile: Dockerfile
    container_name: pred-market
    environment:
      - DATABASE_URL=postgresql://pred:pred123@timescaledb:5432/pred_db
      - REDIS_URL=redis://redis:6379
      - POLYMARKET_API_KEY=${POLYMARKET_API_KEY}
      - KALSHI_API_KEY=${KALSHI_API_KEY}
    ports:
      - "8002:8002"
    depends_on:
      - timescaledb
      - redis
    networks:
      - pred-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 3: EXECUTION ENGINE (Rust for <300ms latency)
  # ═══════════════════════════════════════════════════════════════════════
  
  execution-engine:
    build:
      context: ./execution
      dockerfile: Dockerfile
    container_name: pred-execution
    environment:
      - DATABASE_URL=postgresql://pred:pred123@timescaledb:5432/pred_db
      - REDIS_URL=redis://redis:6379
      - WS_PORT=8003
    ports:
      - "8003:8003"
    depends_on:
      - timescaledb
      - redis
    networks:
      - pred-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ═══════════════════════════════════════════════════════════════════════
  # DATA LAYER: TimescaleDB + Redis
  # ═══════════════════════════════════════════════════════════════════════
  
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: pred-timescaledb
    environment:
      - POSTGRES_USER=pred
      - POSTGRES_PASSWORD=pred123
      - POSTGRES_DB=pred_db
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - pred-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: pred-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    networks:
      - pred-network

  # ═══════════════════════════════════════════════════════════════════════
  # API GATEWAY (NGINX)
  # ═══════════════════════════════════════════════════════════════════════
  
  gateway:
    image: nginx:alpine
    container_name: pred-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8000:80"
    depends_on:
      - intelligence-engine
      - market-engine
      - execution-engine
    networks:
      - pred-network

  # ═══════════════════════════════════════════════════════════════════════
  # FRONTEND (React Terminal)
  # ═══════════════════════════════════════════════════════════════════════
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pred-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_WS_URL=ws://localhost:8003
      - REACT_APP_API_URL=http://localhost:8000
    networks:
      - pred-network

networks:
  pred-network:
    driver: bridge

volumes:
  timescale-data:
  redis-data:
