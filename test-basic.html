<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
</head>
<body style="padding: 50px; font-family: Arial;">
    <h1>✅ HTML is Working</h1>
    <p>If you can see this, HTML files are loading correctly.</p>
    <hr>
    <button onclick="alert('JavaScript is working!')" style="padding: 10px 20px; font-size: 16px;">
        Test JavaScript
    </button>
    <hr>
    <a href="index.html">→ Go to Index</a><br>
    <a href="deposit-new.html">→ Go to Deposit</a><br>
    <a href="vault-new.html">→ Go to Vault</a><br>
    <a href="start.html">→ Go to Start</a>
<script>
    document.querySelectorAll('a[href$=".html"]').forEach(link => {
        const href = link.getAttribute('href');
        if (!href) return;
        const [path, hash] = href.split('#');
        const cleaned = path.replace(/\.html$/, '');
        link.setAttribute('href', hash ? `${cleaned}#${hash}` : cleaned);
    });
    if (window.location.pathname.endsWith('.html')) {
        const cleanPath = window.location.pathname.replace(/\.html$/, '');
        window.history.replaceState({}, '', cleanPath + window.location.search + window.location.hash);
    }
</script>
</body>
</html>
