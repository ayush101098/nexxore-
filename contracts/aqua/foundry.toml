[profile.default]
src = "src"
test = "test"
libs = ["lib"]
# Match swap-vm v1.0.2 (lib/swap-vm/foundry.toml).
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 700
via_ir = true
fs_permissions = [{ access = "read-write", path = "./out" }, { access = "read-write", path = "./demo" }]

[rpc_endpoints]
mainnet = "${AQUA_FORK_RPC_URL}"
