version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nexxore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexxore_prod
      POSTGRES_USER: nexxore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/services/perps/schema.sql:/docker-entrypoint-initdb.d/02-perps.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexxore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: nexxore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Perps Service
  perps:
    build:
      context: .
      dockerfile: Dockerfile.perps
    container_name: nexxore-perps
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexxore:${DB_PASSWORD:-changeme}@postgres:5432/nexxore_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      PERPS_PORT: 3010
      WS_PORT: 3011
      USE_HYPERLIQUID: "true"
      HYPERLIQUID_API_URL: https://api.hyperliquid.xyz
      PERPS_MARKETS: BTC,ETH,SOL,HYPE,ARB,OP,AVAX,MATIC,DOGE,LINK,UNI,ATOM,LTC,BCH,ETC,FIL,APT,STX,INJ,TIA
      PERPS_MAX_LEVERAGE: 50
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "3010:3010"
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3010/api/perps/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend/services/perps/logs:/app/services/perps/logs

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: nexxore-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./perps.html:/usr/share/nginx/html/perps.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - perps

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
