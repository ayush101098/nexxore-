<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiskPilot</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%2339D5FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060B12; --bg2: #0B1220; --surface: #0E1626; --surface2: #121D30;
  --border: rgba(138,180,255,0.12); --border-hi: rgba(57,213,255,0.30);
  --cyan: #39D5FF; --green: #19E6C5; --gold: #F7B955; --red: #FF5C5C; --amber: #F7B955; --grey: #9AA7BA;
  --text: #F4F8FF; --text-muted: #9FB0C7; --text-dim: #6B7A93;
  /* chart series: validated on #0E1626 (dataviz validate_palette, dark) */
  --c-edge: #1E9AC4; --c-cost: #BC8330; --c-vol0: #0FA98F; --c-vol20: #9E74E3;
  --grid: rgba(138,180,255,0.10);
  --body: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace; --radius: 3px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-font-smoothing:antialiased; }
body { background:var(--bg); color:var(--text); font-family:var(--body); font-size:14px; line-height:1.45; overflow-x:hidden; }
a { color:var(--cyan); text-decoration:none; }
button { font-family:var(--body); }
.wrap { max-width:1440px; margin:0 auto; padding:10px 16px 16px; }

/* status bar */
.status { display:flex; align-items:stretch; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; flex-wrap:wrap; }
.st { background:var(--surface); padding:6px 12px; flex:1 1 140px; min-width:0; }
.st.wide { flex:2 1 260px; }
.st.brand { flex:0 0 auto; display:flex; align-items:center; font-weight:700; font-size:0.95rem; padding:0 16px; }
.st .k { font-family:var(--mono); font-size:0.56rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; }
.st .v { font-family:var(--mono); font-size:0.78rem; font-weight:600; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.unavail { color:var(--amber) !important; font-weight:500 !important; font-size:0.68rem !important; white-space:normal !important; font-family:var(--body); }
[data-src] { cursor:help; }

/* layout */
.row { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:10px; margin-bottom:10px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); min-width:0; }
.card-h { padding:8px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; }
.card-h h2 { font-size:0.78rem; font-weight:600; }
.card-h .note { font-family:var(--mono); font-size:0.56rem; color:var(--text-dim); }
.card-b { padding:10px 12px; }
.sub { font-family:var(--mono); font-size:0.56rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin:10px 0 4px; }

/* tables */
.tscroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:0.66rem; }
th { text-align:left; font-weight:500; font-size:0.54rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; padding:5px 7px; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:7px; border-bottom:1px solid var(--border); vertical-align:top; }
td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
tbody tr.pick { cursor:pointer; }
tbody tr.pick:hover td { background:var(--surface2); }
tbody tr.sel td { background:rgba(57,213,255,0.06); }
tbody tr.sel td:first-child { box-shadow:inset 2px 0 0 var(--cyan); }
.small { font-size:0.56rem; color:var(--text-dim); }

.pill { font-family:var(--mono); font-size:0.54rem; font-weight:700; padding:2px 6px; border-radius:2px; white-space:nowrap; }
.pill.APPROVE { background:rgba(25,230,197,0.12); color:var(--green); }
.pill.REJECT { background:rgba(255,92,92,0.12); color:var(--red); }
.pill.REQUOTE { background:rgba(247,185,85,0.12); color:var(--amber); }
.pill.REQUIRE_REVIEW { background:rgba(154,167,186,0.14); color:var(--grey); }
.pill.SHIPPED { background:rgba(25,230,197,0.12); color:var(--green); }
.pill.NOT_SHIPPED { background:rgba(154,167,186,0.14); color:var(--grey); }

/* decision panel */
.dec-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.dec-id { font-family:var(--mono); font-size:0.58rem; color:var(--text-dim); }
.reason { font-size:0.76rem; margin:5px 0 0; line-height:1.4; }
.act { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; }
.btn { padding:7px 14px; border:none; border-radius:var(--radius); background:var(--green); color:#04120F; font-size:0.72rem; font-weight:700; cursor:pointer; }
.btn:disabled { background:var(--surface2); color:var(--text-dim); cursor:not-allowed; }
.btn.ghost { background:none; border:1px solid var(--border); color:var(--text-muted); font-weight:500; }
.btn.ghost:hover { border-color:var(--cyan); color:var(--cyan); }
.btn.sm { padding:2px 8px; font-size:0.6rem; }
.countdown { font-family:var(--mono); font-size:0.66rem; color:var(--text-muted); }
.log { font-family:var(--mono); font-size:0.58rem; color:var(--text-muted); margin-top:5px; line-height:1.6; max-height:64px; overflow-y:auto; }
.log .ok { color:var(--green); } .log .bad { color:var(--red); }
.cells { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:5px; }
.cells.c4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
.cells.aq { grid-template-columns:minmax(0,1.7fr) repeat(5,minmax(0,1fr)); }
.cells.c2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.cell { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:5px 7px; min-width:0; }
.cell .k { font-family:var(--mono); font-size:0.5rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap; }
.cell .v { font-family:var(--mono); font-size:0.72rem; font-weight:600; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.inputs { font-family:var(--mono); font-size:0.56rem; color:var(--text-dim); line-height:1.55; }
.chart { width:100%; display:block; }
.chart text { font-family:var(--mono); font-size:10px; fill:var(--text-muted); }
.chart .axis { stroke:var(--grid); stroke-width:1; }
.chart .ref { stroke:var(--text-muted); stroke-width:1.5; }
.chart .hit { fill:transparent; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-family:var(--mono); font-size:0.56rem; color:var(--text-muted); margin-top:2px; }
.legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
.legend i.line { height:2px; width:13px; vertical-align:3px; background:var(--text-muted); }
details summary { font-family:var(--mono); font-size:0.56rem; color:var(--text-dim); cursor:pointer; margin-top:3px; }

.pos-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:10px; }
.curve { padding:7px 0; border-bottom:1px solid var(--border); }
.curve:last-child { border-bottom:none; }
.curve-t { font-size:0.7rem; font-weight:600; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
.hash { font-family:var(--mono); font-size:0.6rem; color:var(--text-muted); margin-top:4px; }

#tip { position:fixed; z-index:50; pointer-events:none; background:var(--surface2); border:1px solid var(--border-hi); border-radius:var(--radius); padding:6px 9px; font-family:var(--mono); font-size:0.6rem; color:var(--text); line-height:1.6; display:none; max-width:300px; white-space:pre-line; }

@media (max-width:1100px) { .row, .pos-grid { grid-template-columns:1fr; } .cells { grid-template-columns:repeat(3,minmax(0,1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="status" id="status"></div>

  <div class="row">
    <div class="card">
      <div class="card-h"><h2>Opportunities</h2><span class="note" id="oppNote"></span></div>
      <div class="card-b tscroll" id="opps"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Decision</h2><span class="note" id="decNote"></span></div>
      <div class="card-b" id="decision"></div>
    </div>
  </div>

  <div class="pos-grid">
    <div class="card">
      <div class="card-h"><h2>Aqua curves</h2><span class="note">AquaSwapVMRouter v1.0.2</span></div>
      <div class="card-b" id="aqua"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>v4 hook</h2><span class="note">VolatilityFeeHook</span></div>
      <div class="card-b" id="hook"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Arc</h2><span class="note">RiskPilotEscrow</span></div>
      <div class="card-b" id="arc"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Decision history</h2><span class="note">Replay re-runs the stored inputs</span></div>
    <div class="card-b tscroll" id="history"></div>
  </div>
</div>
<div id="tip"></div>

<script type="module">
import { execute, aquaAdapter, v4Adapter, arcAdapter } from "/riskpilot/web/adapters.js";

// ── config ────────────────────────────────────────────────────────────────
const qs = new URLSearchParams(location.search);
const ENGINE = qs.get("engine") || (location.port === "8000" ? location.origin : "http://localhost:8000");
const RPC = qs.get("rpc") || "http://127.0.0.1:8545";
const CHAIN_ID = 31337;
const ARC = { id: 5042002, rpc: qs.get("arcRpc") || "https://rpc.testnet.arc.io", explorer: "https://explorer.testnet.arc.io",
  usdc: "0x3600000000000000000000000000000000000000" };
const A = {
  AQUA: "0x1111113CCf1426A8E30e2bfF5E005d929bF6a90a",
  ROUTER: "0x111111338c5091E8440b67B168bAe16a668AC0De",
  WETH: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2",
  USDC: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48",
};
// Anvil account #0 (public test key) signs on the demo chain only when no browser wallet is on 31337.
const DEMO_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80";
const HEARTBEAT_MS = 2000; // "Source unavailable" within 5 s of a source stopping

const S = { up: { engine: false, chain: false }, health: null, profiles: null, info: null, seed: null, sel: 0,
  history: [], executions: [], chain: null, signer: null, log: [], at: {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const now = () => new Date().toISOString().replace(/\.\d+Z$/, "Z");
const ts = (iso) => (iso ? String(iso).replace("T", " ").replace(/\.\d+Z$/, "Z") : "");
const usd = (v) => { const n = Number(v); return (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const num = (v, d = 2) => Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const short = (h) => (h ? h.slice(0, 6) + "…" + h.slice(-4) : "");
const src = (source, at) => `data-src="${esc(`source: ${source}\nat: ${at || now()}`)}"`;
const unavailable = (name) => `<span class="unavail">Source unavailable: ${esc(name)}</span>`;

async function engine(path, opts = {}) {
  const r = await fetch(ENGINE + path, { ...opts, headers: { "content-type": "application/json" } });
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 160)}`);
  return r.json();
}

// ── viem ──────────────────────────────────────────────────────────────────
let V = null;
async function loadViem() {
  const [viem, chains, accounts] = await Promise.all([
    import("https://cdn.jsdelivr.net/npm/viem@2.21.0/+esm"),
    import("https://cdn.jsdelivr.net/npm/viem@2.21.0/chains/+esm"),
    import("https://cdn.jsdelivr.net/npm/viem@2.21.0/accounts/+esm"),
  ]);
  const chain = { ...chains.foundry, rpcUrls: { default: { http: [RPC] } } };
  const arcChain = viem.defineChain({ id: ARC.id, name: "Arc Testnet", nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 }, rpcUrls: { default: { http: [ARC.rpc] } } });
  V = { viem, chain, arcChain, accounts,
    pub: viem.createPublicClient({ chain, transport: viem.http(RPC) }),
    arcPub: viem.createPublicClient({ chain: arcChain, transport: viem.http(ARC.rpc) }),
    erc20: viem.parseAbi(["function balanceOf(address) view returns (uint256)"]),
    events: {
      shipped: viem.parseAbiItem("event Shipped(address maker, address app, bytes32 strategyHash, bytes strategy)"),
      swapped: viem.parseAbiItem("event Swapped(bytes32 orderHash, address maker, address taker, address tokenIn, address tokenOut, uint256 amountIn, uint256 amountOut)"),
      feeUpdated: viem.parseAbiItem("event FeeUpdated(bytes32 indexed poolId, uint256 sigma, uint24 fee)"),
      funded: viem.parseAbiItem("event Funded(bytes32 indexed decisionId, address indexed depositor, uint256 amount)"),
      settled: viem.parseAbiItem("event Settled(bytes32 indexed decisionId, address indexed depositor, uint256 amount, uint256 payout, uint256 reserve)"),
    } };
}

async function demoSigner() {
  if (window.ethereum) {
    try {
      if (parseInt(await window.ethereum.request({ method: "eth_chainId" }), 16) === CHAIN_ID) {
        const [address] = await window.ethereum.request({ method: "eth_requestAccounts" });
        return { kind: "browser wallet", address, client: V.viem.createWalletClient({ account: address, chain: V.chain, transport: V.viem.custom(window.ethereum) }) };
      }
    } catch { /* use the demo key */ }
  }
  const account = V.accounts.privateKeyToAccount(DEMO_KEY);
  return { kind: "Anvil #0 (public test key)", address: account.address, client: V.viem.createWalletClient({ account, chain: V.chain, transport: V.viem.http(RPC) }) };
}

async function arcSigner() {
  if (!window.ethereum) throw new Error("no browser wallet for Arc testnet");
  await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x" + ARC.id.toString(16) }] });
  const [address] = await window.ethereum.request({ method: "eth_requestAccounts" });
  return { kind: "browser wallet", address, client: V.viem.createWalletClient({ account: address, chain: V.arcChain, transport: V.viem.custom(window.ethereum) }) };
}

// ── status bar ────────────────────────────────────────────────────────────
function renderStatus() {
  const c = S.chain, p = S.profiles?.balanced, info = S.info;
  const cell = (k, v, cls = "") => `<div class="st ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const tok = (raw, dec, unit, d) => (c && raw !== undefined ? `<span data-testid="hold-${unit}" ${src(`balanceOf ${unit} · ${RPC}`, c.at)}>${num(Number(raw) / 10 ** dec, d)} ${unit}</span>` : unavailable("demo chain"));
  $("status").innerHTML = [
    `<div class="st brand">RiskPilot</div>`,
    cell("Chain", c && info ? `<span ${src("eth_chainId, eth_blockNumber · " + RPC + "; fork block from demo/curves.json", c.at)}>Ethereum mainnet fork · block ${Number(info.fork_block).toLocaleString()}</span>` : unavailable("demo chain"), "wide"),
    cell("Wallet", info ? `<span ${src("demo/curves.json maker", S.at.info)}>${short(info.maker)}</span>` : unavailable("engine")),
    cell("WETH", tok(c?.weth, 18, "WETH", 4)),
    cell("USDC", tok(c?.usdc, 6, "USDC", 2)),
    cell("Profile", p ? `<span ${src("engine GET /profiles", S.at.profiles)}>Balanced · ${usd(p.budget)}</span>` : unavailable("engine")),
    cell("Engine", S.up.engine && S.health ? `<span ${src("engine GET /health · " + ENGINE, S.at.health)}>${esc(S.health.model_version)}</span>` : unavailable("engine " + ENGINE)),
  ].join("");
  bindTips($("status"));
}

// ── opportunities ────────────────────────────────────────────────────────
const age = (iso) => Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
function renderOpps() {
  if (!S.up.engine || !S.seed) { $("opps").innerHTML = unavailable(S.seedErr || "engine " + ENGINE); $("oppNote").textContent = ""; return; }
  const rows = S.seed.items.map((it, i) => {
    const o = it.opportunity, d = it.decision, s = src(`engine POST /demo/seed · ${o.source}`, d.created_at);
    return `<tr class="pick ${i === S.sel ? "sel" : ""}" data-i="${i}" tabindex="0" data-testid="opp-row" data-label="${esc(it.label)}" data-decision="${d.decision_id}">
      <td ${s}>${esc(o.type)} · ${esc(o.pair)}<div class="small">${esc(o.source_venue)} → ${esc(o.target)}</div></td>
      <td class="num" ${s}>${usd(o.observed_price)}<div class="small">ref ${usd(o.reference_price)}</div></td>
      <td class="num" ${s}>${usd(o.size)}</td>
      <td class="num" ${s}>${usd(d.gross_edge)}</td>
      <td class="num" ${s}>${usd(d.net_edge)}</td>
      <td><span class="pill ${d.verdict}" data-testid="opp-verdict">${d.verdict}</span></td>
      <td class="num" data-age="${o.observed_at}" ${src("now − opportunity.observed_at", o.observed_at)}>${age(o.observed_at)} s</td></tr>`;
  }).join("");
  $("opps").innerHTML = `<table><thead><tr><th>Type · pair</th><th class="num">Observed</th><th class="num">Size</th><th class="num">Gross</th><th class="num">Net</th><th>Verdict</th><th class="num">Age</th></tr></thead><tbody>${rows}</tbody></table>`;
  $("oppNote").textContent = `seeded ${ts(S.seed.as_of)}`;
  document.querySelectorAll("#opps tr.pick").forEach((tr) => {
    const go = () => { S.sel = Number(tr.dataset.i); renderOpps(); renderDecision(); renderArc(); };
    tr.addEventListener("click", go);
    tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  bindTips($("opps"));
}

// ── charts ────────────────────────────────────────────────────────────────
const tip = $("tip");
function bindTips(root) {
  root.querySelectorAll("[data-tip],[data-src]").forEach((el) => {
    el.addEventListener("mousemove", (e) => {
      tip.innerHTML = el.dataset.tip || esc(el.dataset.src); tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
    });
    el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}
const niceStep = (span) => { const raw = span / 4, p = 10 ** Math.floor(Math.log10(raw || 1)); return [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw); };

function waterfall(d) {
  const steps = [{ key: "gross", k: d.inputs.aqua ? "Premium" : "Gross edge", v: +d.gross_edge, kind: "edge" }];
  for (const [k, v] of Object.entries(d.costs)) steps.push({ key: k, k: k[0].toUpperCase() + k.slice(1), v: -v, kind: "cost" });
  steps.push({ key: "risk", k: "Risk charge", v: -d.risk_charge, kind: "cost" });
  let run = 0;
  const bars = steps.map((s) => { const a = run; run += s.v; return { ...s, a, b: run }; });
  bars.push({ key: "net", k: "Net edge", v: +d.net_edge, kind: "edge", a: 0, b: +d.net_edge, net: true });
  const hurdle = +d.inputs.hurdle, vals = bars.flatMap((b) => [b.a, b.b]).concat([0, hurdle]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const step = niceStep(hi - lo || 1); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 560, L = 84, R = 62, rowH = 17, barH = 11, top = 14, H = top + bars.length * rowH + 16;
  const x = (v) => L + ((v - lo) / (hi - lo)) * (W - L - R);
  let g = "";
  for (let t = lo; t <= hi + 1e-9; t += step) g += `<line class="axis" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 14}"/><text x="${x(t)}" y="${H - 3}" text-anchor="middle">${t < 0 ? "−" : ""}$${Math.abs(t).toLocaleString()}</text>`;
  bars.forEach((b, i) => {
    const y = top + i * rowH + (rowH - barH) / 2, x0 = x(Math.min(b.a, b.b)), w = Math.max(1, Math.abs(x(b.b) - x(b.a)));
    const valX = x(Math.max(b.a, b.b)) + 5;
    g += `<text x="${L - 7}" y="${y + barH - 2}" text-anchor="end" style="fill:var(--text)">${b.k}</text>`;
    if (Math.abs(b.v) > 0) g += `<rect x="${x0}" y="${y}" width="${w}" height="${barH}" rx="3" fill="var(--c-${b.kind === "edge" ? "edge" : "cost"})"/>`;
    g += `<text data-wf="${b.key}" x="${Math.min(valX, W - 3)}" y="${y + barH - 2}" text-anchor="${valX > W - R ? "end" : "start"}">${b.net ? usd(b.v) : (b.v < 0 ? "−" : "") + usd(Math.abs(b.v))}</text>`;
    g += `<rect class="hit" x="0" y="${top + i * rowH}" width="${W}" height="${rowH}" data-tip="${esc(`${b.k}: ${usd(b.v)}${b.net ? `<br>hurdle ${usd(hurdle)}` : ""}`)}"/>`;
  });
  g += `<line class="ref" x1="${x(hurdle)}" x2="${x(hurdle)}" y1="${top - 3}" y2="${H - 14}"/><text x="${x(hurdle)}" y="${top - 5}" text-anchor="middle" style="fill:var(--text)">hurdle ${usd(hurdle)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost waterfall from gross edge to net edge">${g}</svg>
    <div class="legend"><span><i style="background:var(--c-edge)"></i>edge</span><span><i style="background:var(--c-cost)"></i>cost</span><span><i class="line"></i>hurdle</span></div>`;
}

function stressChart(d) {
  const grid = d.inputs.stress_grid || [];
  if (!grid.length) return `<div class="small">No stress grid: the decision stopped before pricing.</div>`;
  const budget = +d.budget, spots = [...new Set(grid.map((s) => s.spot_shock))], at = (sp, vo) => grid.find((s) => s.spot_shock === sp && s.vol_shock === vo);
  const vals = grid.map((s) => +s.pnl_after).concat([0, -budget]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const step = niceStep(hi - lo || 1); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 560, L = 50, R = 6, top = 6, H = 128, bot = 18, gw = (W - L - R) / spots.length, bw = Math.min(14, gw / 2 - 4);
  const y = (v) => top + ((hi - v) / (hi - lo)) * (H - top - bot), tk = (v) => (Math.abs(v) >= 1000 ? `${(v / 1000).toLocaleString()}K` : v.toLocaleString());
  let g = "";
  for (let t = lo; t <= hi + 1e-9; t += step) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 5}" y="${y(t) + 3}" text-anchor="end">${t < 0 ? "−" : ""}$${tk(Math.abs(t))}</text>`;
  spots.forEach((sp, i) => {
    const cx = L + gw * i + gw / 2;
    g += `<text x="${cx}" y="${H - 4}" text-anchor="middle">${(+sp > 0 ? "+" : "") + Math.round(+sp * 100)}%</text>`;
    ["0.00", "0.20"].forEach((vo, j) => {
      const s = at(sp, vo); if (!s) return;
      const v = +s.pnl_after, x0 = cx + (j === 0 ? -bw - 1 : 1), y0 = y(Math.max(v, 0)), h = Math.max(1, Math.abs(y(v) - y(0))), r = Math.min(3, h / 2);
      const path = v >= 0
        ? `M${x0},${y0 + h} V${y0 + r} Q${x0},${y0} ${x0 + r},${y0} H${x0 + bw - r} Q${x0 + bw},${y0} ${x0 + bw},${y0 + r} V${y0 + h} Z`
        : `M${x0},${y0} V${y0 + h - r} Q${x0},${y0 + h} ${x0 + r},${y0 + h} H${x0 + bw - r} Q${x0 + bw},${y0 + h} ${x0 + bw},${y0 + h - r} V${y0} Z`;
      g += `<path d="${path}" fill="var(--c-vol${j === 0 ? "0" : "20"})"/>`;
      g += `<rect class="hit" x="${x0 - 2}" y="${top}" width="${bw + 4}" height="${H - top - bot}" data-tip="${esc(`spot ${(+sp > 0 ? "+" : "") + Math.round(+sp * 100)}% · vol +${Math.round(+vo * 100)} pts<br>after ${usd(s.pnl_after)} · before ${usd(s.pnl_before)}`)}"/>`;
    });
  });
  g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--text-dim)"/>`;
  g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(-budget)}" y2="${y(-budget)}"/><text x="${L + 4}" y="${y(0) - 4}" style="fill:var(--text)">budget −${usd(budget)}</text>`;
  const table = grid.map((s) => `<tr><td>${s.spot_shock}</td><td>${s.vol_shock}</td><td class="num">${usd(s.pnl_before)}</td><td class="num">${usd(s.pnl_after)}</td></tr>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Post-trade P&amp;L across 14 stress scenarios against the loss budget">${g}</svg>
    <div class="legend"><span><i style="background:var(--c-vol0)"></i>vol +0</span><span><i style="background:var(--c-vol20)"></i>vol +20 pts</span><span><i class="line"></i>loss budget</span></div>
    <details><summary>Table</summary><table><thead><tr><th>Spot</th><th>Vol</th><th class="num">P&amp;L before</th><th class="num">P&amp;L after</th></tr></thead><tbody>${table}</tbody></table></details>`;
}

function renderDecision() {
  clearInterval(timer);

  const it = S.seed.items[S.sel], d = it.decision, inp = d.inputs, aq = inp.aqua, ds = src(`engine generate_execution_decision · ${d.model_version}`, d.created_at);
  const shipped = liveShipped(d), kind = adapterFor(d);
  const live = d.verdict === "APPROVE" && Date.parse(d.expires_at) > Date.now() && !shipped && kind && S.up.chain;
  let h = `<div class="dec-head" data-testid="decision" data-decision="${d.decision_id}"><span class="pill ${d.verdict}" data-testid="dec-verdict">${d.verdict}</span><span class="dec-id" ${ds}>${d.decision_id} · ${ts(d.created_at)}</span></div>
    <div class="reason" data-testid="dec-reason" ${ds}>${esc(d.reason)}</div>

      <span class="small">${live ? "signer: " + esc(S.signer?.kind || "") : ""}</span></div>
    <div class="log" id="log">${S.log.join("<br>")}</div>`;
  h += `<div class="sub">Net edge, USD</div>${waterfall(d)}`;
  h += `<div class="sub" ${ds}>Stress · worst loss <span data-testid="stress-before">${usd(d.stress_loss_before)}</span> → <span data-testid="stress-after">${usd(d.stress_loss_after)}</span> · budget <span data-testid="budget">${usd(d.budget)}</span></div>${stressChart(d)}`;
  if (aq) {
    const cv = (k, v) => `<div class="cell"><div class="k">${k}</div><div class="v" data-testid="aq-${k}" ${src("engine: Black-Scholes at K_eq, T_eq (decision.inputs.aqua)", d.created_at)}>${v}</div></div>`;
    h += `<div class="sub">Aqua curve · ${aq.side.replace("_", "-")}</div><div class="cells aq">
      ${cv("Range", `${num(aq.range_low, 0)}–${num(aq.range_high, 0)}`)}${cv("K_eq", usd(aq.k_eq))}${cv("T_eq", num(aq.t_eq_days, 2) + " d")}
      ${cv("C_eq", usd(aq.c_eq) + "/ETH")}${cv("f_min", num(aq.f_min * 100, 4) + "%")}${cv("Fee", num(aq.fee_rate * 100, 4) + "%")}</div>`;
  }
  const tsOf = (k) => inp.timestamps?.[k];
  const lines = Object.entries(inp.sources || {}).map(([k, v]) => `${k}: ${esc(v)}${tsOf(k) ? ` @ ${ts(tsOf(k))}` : ""}`);
  if (inp.request?.holdings) lines.push(`holdings: ${num(inp.request.holdings.weth, 4)} WETH, ${num(inp.request.holdings.usdc, 2)} USDC`);
  h += `<div class="sub">Inputs</div><div class="inputs">${lines.join("<br>")}</div>`;
  $("decision").innerHTML = h;
  $("decNote").textContent = it.label;
  bindTips($("decision"));
  const tick = () => {
    const btn = $("approve");
    if (!btn || !live) return clearInterval(timer);
    const left = Math.max(0, Math.ceil((Date.parse(d.expires_at) - Date.now()) / 1000));
    if (left > 0) { if (!btn.dataset.busy) btn.textContent = `Approve and sign · ${left}s`; }
    else { btn.disabled = true; btn.textContent = "Expired: request a new decision"; clearInterval(timer); }
  };
  tick(); timer = setInterval(tick, 250);
  if (live) $("approve").onclick = () => approve(d, kind);
}

function log(msg, cls = "") { S.log.push(`<span class="${cls}">${esc(new Date().toLocaleTimeString())} ${esc(msg)}</span>`); const el = $("log"); if (el) { el.innerHTML = S.log.join("<br>"); el.scrollTop = el.scrollHeight; } }

// Why "Approve and sign" is disabled, from the decision's own verdict and reason.
function whyDisabled(d, shipped, kind) {
  if (shipped) return "Already shipped";
  if (!S.up.chain) return "Demo chain unavailable";
  if (d.verdict === "APPROVE") return Date.parse(d.expires_at) <= Date.now() ? "Expired: request a new decision" : kind ? "Approve and sign" : "No adapter for this venue";
  const r = d.reason;
  if (/post-trade stress/.test(r)) return "Rejected: stress over budget";
  if (/net edge/.test(r)) return "Rejected: net edge below hurdle";
  if (/premium floor/.test(r)) return "Rejected: fee below premium floor";
  if (/liquidity/.test(r)) return "Rejected: liquidity below size";
  if (/gas/.test(r)) return "Rejected: gas over budget";
  if (/curve needs/.test(r)) return "Rejected: holdings cannot fund the curve";
  if (d.verdict === "REQUOTE") return "Requote: quote expired or moved";
  if (d.verdict === "REQUIRE_REVIEW") return "Review: input stale or out of range";
  return d.verdict;
}

async function approve(d, kind) {
  $("approve").disabled = true; $("approve").dataset.busy = "1"; $("approve").textContent = "Signing…";
  S.busy = true;
  try {
    const signer = S.signer || (S.signer = await demoSigner());
    const ctx = { viem: V.viem, pub: V.pub, chainId: CHAIN_ID, A, signer };
    const adapter = kind === "aqua" ? aquaAdapter({ ...ctx, info: S.info }) : v4Adapter({ ...ctx, hook: S.info?.hook });
    const execution = await execute(adapter, d, signer, V.pub, log);
    const position = await engine("/executions", { method: "POST", body: JSON.stringify(execution) });
    log(`verified · engine position ${position.position_id} ${position.status}`, "ok");
    S.busy = false;
    await refreshAll();
  } catch (e) { S.busy = false; log(String(e.shortMessage || e.message || e), "bad"); renderDecision(); }
}

async function verifyTx(hash) {

  } catch { out.innerHTML = unavailable("receipt"); }
}

function feeChart(points, flatPct) {
  const W = 420, H = 140, L = 42, R = 8, top = 8, bot = 20, fees = points.map((p) => p.fee);
  const hi = Math.max(1, Math.ceil(Math.max(...fees, flatPct) * 4) / 4), n = points.length;
  const x = (i) => L + (n === 1 ? 0 : (i / (n - 1)) * (W - L - R)), y = (v) => top + (1 - v / hi) * (H - top - bot);
  let g = "";
  for (let t = 0; t <= hi + 1e-9; t += hi / 4) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 5}" y="${y(t) + 3}" text-anchor="end">${t.toFixed(2)}%</text>`;
  g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(flatPct)}" y2="${y(flatPct)}"/><text x="${W - R}" y="${y(flatPct) - 4}" text-anchor="end" style="fill:var(--text)">static ${flatPct.toFixed(2)}%</text>`;
  g += `<path d="${points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.fee).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--c-edge)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  points.forEach((p, i) => {
    g += `<circle cx="${x(i)}" cy="${y(p.fee)}" r="4" fill="var(--c-edge)" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<rect class="hit" x="${x(i) - 8}" y="${top}" width="16" height="${H - top - bot}" data-tip="${esc(`block ${p.block}<br>fee ${p.pips.toLocaleString()} pips · ${p.fee.toFixed(3)}%<br>σ_ann ${(p.sigma * 100).toFixed(1)}%`)}"/>`;
  });
  g += `<text x="${L}" y="${H - 4}">block ${points[0].block}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${points[n - 1].block}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hook fee per block against a static 0.30% pool">${g}</svg>
    <div class="legend"><span><i style="background:var(--c-edge)"></i>hook fee per block</span><span><i class="line"></i>static 0.30%</span></div>`;
}

    const adapter = arcAdapter({ viem: V.viem, arcPub: V.arcPub, dep, usdc: ARC.usdc, stakeUnits: V.viem.parseUnits(String(dep.stake_usdc), 6), signer });
    const rec = await execute(adapter, d, signer, V.arcPub, (m) => { out.textContent = m; });
    out.innerHTML = `funded ${arcLink(rec.tx_hash)}`;
    await renderArc();
  } catch (e) { out.innerHTML = `<span class="unavail">${esc(e.shortMessage || e.message)}</span>`; }
}

// ── history ──────────────────────────────────────────────────────────────
function renderHistory() {
  if (!S.up.engine) { $("history").innerHTML = unavailable("engine " + ENGINE); return; }
  const txs = new Map(S.executions.map((e) => [e.decision_id, e]));
  const rows = S.history.map((d) => {
    const e = txs.get(d.decision_id);
    return `<tr data-testid="history-row" data-decision="${d.decision_id}" data-verdict="${d.verdict}"><td class="small" style="white-space:nowrap">${ts(d.created_at)}</td><td>${esc(d.opportunity_id)}</td><td><span class="pill ${d.verdict}">${d.verdict}</span></td>
      <td style="font-family:var(--body);color:var(--text-muted);min-width:260px">${esc(d.reason)}</td>
      <td class="hash" style="white-space:nowrap">${e ? `${short(e.tx_hash)}${e.settlement_tx ? ` · settle ${arcLink(e.settlement_tx)}` : ""}` : ""}</td>
      <td style="white-space:nowrap"><button class="btn ghost sm" data-replay="${d.decision_id}">Replay</button> <span data-rout="${d.decision_id}"></span></td></tr>`;
  }).join("");
  $("history").innerHTML = `<table><thead><tr><th>Time</th><th>Opportunity</th><th>Verdict</th><th>Reason</th><th>Transaction</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll("[data-replay]").forEach((b) => b.addEventListener("click", async () => {
    const out = document.querySelector(`[data-rout="${b.dataset.replay}"]`);
    try {
      const r = await engine(`/decisions/${b.dataset.replay}/replay`, { method: "POST" });
      out.innerHTML = `<span data-testid="replay-result" style="color:var(--${r.matches ? "green" : "red"})">${r.matches ? "identical" : "differs"} · ${r.decision.verdict} · net ${usd(r.decision.net_edge)}</span>`;
    }
    catch { out.innerHTML = unavailable("engine replay"); }
  }));
}

// ── data + heartbeat ─────────────────────────────────────────────────────
async function readChain() {
  const maker = S.info?.maker, [block, chainId] = await Promise.all([V.pub.getBlockNumber(), V.pub.getChainId()]);
  const out = { block, chainId, at: now() };
  if (maker) [out.weth, out.usdc] = await Promise.all([A.WETH, A.USDC].map((t) => V.pub.readContract({ address: t, abi: V.erc20, functionName: "balanceOf", args: [maker] })));
  return out;
}

async function loadEngine() {
  const [health, profiles, info] = await Promise.all([engine("/health"), engine("/profiles"), engine("/demo/info").catch(() => null)]);
  S.health = health; S.profiles = profiles; S.info = info; S.at.health = S.at.profiles = S.at.info = now();
  [S.history, S.executions] = await Promise.all([engine("/decisions?limit=12"), engine("/executions")]);
}

async function seed() {
  try { S.seed = await engine("/demo/seed", { method: "POST" }); S.seedErr = null; }
  catch (e) { S.seed = null; S.seedErr = "engine POST /demo/seed: " + e.message; }
  const approved = S.seed?.items.findIndex((i) => i.decision.verdict === "APPROVE");
  if (approved >= 0) S.sel = approved;
}

async function refreshAll() {
  try { await loadEngine(); S.up.engine = true; } catch { S.up.engine = false; S.seed = null; }
  try { if (!V) await loadViem(); S.chain = await readChain(); S.up.chain = true; } catch { S.up.chain = false; S.chain = null; }
  renderStatus(); renderOpps(); renderDecision(); renderHistory();
  await Promise.all([renderAqua(), renderHook(), renderArc()]);
  renderDecision();
}

let lastBlock = null;
async function heartbeat() {
  const was = { ...S.up };
  try { S.health = await engine("/health"); S.at.health = now(); S.up.engine = true; } catch { S.up.engine = false; }
  try { S.chain = await readChain(); S.up.chain = true; } catch { S.up.chain = false; S.chain = null; }
  if (was.engine !== S.up.engine || was.chain !== S.up.chain) {
    // A source came back: reseed so nothing on screen predates the outage.
    if (S.up.engine && !was.engine) await seed();
    if (!S.up.engine) { S.seed = null; S.seedErr = "engine " + ENGINE; }
    await refreshAll();
  } else {
    renderStatus();
    if (S.up.chain && S.chain.block !== lastBlock) { await Promise.all([renderAqua(), renderHook()]); if (!S.busy) renderDecision(); }
  }
  if (S.chain) lastBlock = S.chain.block;
  document.querySelectorAll("[data-age]").forEach((el) => { el.textContent = `${age(el.dataset.age)} s`; });
}

async function main() {
  try { await loadViem(); } catch { /* chain panels report the CDN as unavailable */ }
  try { await loadEngine(); S.up.engine = true; } catch { S.up.engine = false; }
  if (V) { try { S.chain = await readChain(); S.up.chain = true; S.signer = await demoSigner(); } catch { S.up.chain = false; } }
  if (S.up.engine) await seed();
  await refreshAll();
  setInterval(heartbeat, HEARTBEAT_MS);
  setInterval(() => document.querySelectorAll("[data-age]").forEach((el) => { el.textContent = `${age(el.dataset.age)} s`; }), 1000);
}
main();
</script>
</body>
</html>
