[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}, {access = "read-write", path = "./out"}, {access = "read-write", path = "./demo"}, {access = "read-write", path = "./deployments"}]
libs = ["lib"]
out = "out"
# No pin: v4-core PoolManager needs =0.8.26 while the template pins 0.8.30, so let forge pick per file.
auto_detect_solc = true
src = "src"
via_ir = false

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false
