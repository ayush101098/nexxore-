components:
  schemas:
    AquaCurveParams:
      properties:
        side:
          type: string
          enum:
          - call_like
          - put_like
          title: Side
        range_low:
          anyOf:
          - type: number
          - type: string
          title: Range Low
        range_high:
          anyOf:
          - type: number
          - type: string
          title: Range High
      additionalProperties: false
      type: object
      required:
      - side
      - range_low
      - range_high
      title: AquaCurveParams
      description: The curve an aqua_premium decision would ship; market.fee_rate is its Fee instruction.
    AquaPriceBody:
      properties:
        spot:
          anyOf:
          - type: number
          - type: string
          title: Spot
        range_low:
          anyOf:
          - type: number
          - type: string
          title: Range Low
        range_high:
          anyOf:
          - type: number
          - type: string
          title: Range High
        side:
          type: string
          enum:
          - call_like
          - put_like
          title: Side
        size:
          anyOf:
          - type: number
          - type: string
          title: Size
        volatility:
          anyOf:
          - type: number
          - type: string
          title: Volatility
      additionalProperties: false
      type: object
      required:
      - spot
      - range_low
      - range_high
      - side
      - size
      - volatility
      title: AquaPriceBody
    EvaluateBody:
      properties:
        opportunity:
          additionalProperties: true
          type: object
          title: Opportunity
        size:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Size
        profile:
          type: string
          enum:
          - conservative
          - moderate
          - aggressive
          - balanced
          title: Profile
          default: moderate
        market:
          anyOf:
          - $ref: '#/components/schemas/Market'
          - type: 'null'
        book:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Book
        as_of:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
        tolerance:
          anyOf:
          - type: number
          - type: string
          title: Tolerance
          default: '0.003'
        gas_budget:
          anyOf:
          - type: number
          - type: string
          title: Gas Budget
          default: '25.00'
        aqua:
          anyOf:
          - $ref: '#/components/schemas/AquaCurveParams'
          - type: 'null'
        holdings:
          anyOf:
          - $ref: '#/components/schemas/Holdings'
          - type: 'null'
        wallet:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet
      additionalProperties: false
      type: object
      required:
      - opportunity
      title: EvaluateBody
      description: What a caller may send; the API fills the gaps before evaluating.
    Gas:
      properties:
        units:
          anyOf:
          - type: number
          - type: string
          title: Units
        price_gwei:
          anyOf:
          - type: number
          - type: string
          title: Price Gwei
        observed_at:
          type: string
          format: date-time
          title: Observed At
        source:
          type: string
          title: Source
      additionalProperties: false
      type: object
      required:
      - units
      - price_gwei
      - observed_at
      - source
      title: Gas
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Hedge:
      properties:
        ratio:
          anyOf:
          - type: number
          - type: string
          title: Ratio
          default: '0'
        cost:
          anyOf:
          - type: number
          - type: string
          title: Cost
          default: '0'
      additionalProperties: false
      type: object
      title: Hedge
    Holdings:
      properties:
        weth:
          anyOf:
          - type: number
          - type: string
          title: Weth
          default: '0'
        usdc:
          anyOf:
          - type: number
          - type: string
          title: Usdc
          default: '0'
      additionalProperties: false
      type: object
      title: Holdings
      description: 'Wallet balances. WETH counts in the before-book as spot ETH, so a curve funded

        from held ETH is measured against the ETH risk the wallet already carried.'
    Market:
      properties:
        quote:
          $ref: '#/components/schemas/Quote'
        liquidity:
          anyOf:
          - type: number
          - type: string
          title: Liquidity
        gas:
          $ref: '#/components/schemas/Gas'
        fee_rate:
          anyOf:
          - type: number
          - type: string
          title: Fee Rate
        volatility:
          $ref: '#/components/schemas/Volatility'
        hedge:
          $ref: '#/components/schemas/Hedge'
          default:
            ratio: '0'
            cost: '0'
      additionalProperties: false
      type: object
      required:
      - quote
      - liquidity
      - gas
      - fee_rate
      - volatility
      title: Market
    Quote:
      properties:
        price:
          anyOf:
          - type: number
          - type: string
          title: Price
        mid:
          anyOf:
          - type: number
          - type: string
          title: Mid
        quoted_at:
          type: string
          format: date-time
          title: Quoted At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        latency_seconds:
          anyOf:
          - type: number
          - type: string
          title: Latency Seconds
        source:
          type: string
          title: Source
      additionalProperties: false
      type: object
      required:
      - price
      - mid
      - quoted_at
      - expires_at
      - latency_seconds
      - source
      title: Quote
    ScanBody:
      properties:
        pair:
          type: string
          title: Pair
          default: ETH/USDC
        sources:
          items:
            type: string
          type: array
          title: Sources
          default:
          - recorded
        size:
          anyOf:
          - type: number
          - type: string
          title: Size
          default: '10000.00'
        min_gap_bps:
          anyOf:
          - type: number
          - type: string
          title: Min Gap Bps
          default: '5'
        as_of:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      additionalProperties: false
      type: object
      title: ScanBody
    StressBody:
      properties:
        positions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Positions
        spot:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Spot
      additionalProperties: false
      type: object
      required:
      - positions
      title: StressBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Volatility:
      properties:
        annualized:
          anyOf:
          - type: number
          - type: string
          title: Annualized
        observed_at:
          type: string
          format: date-time
          title: Observed At
        source:
          type: string
          title: Source
      additionalProperties: false
